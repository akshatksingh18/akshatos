name: AkshatOS

options:
  bundleIdPrefix: com.akshatksingh18
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"

configs:
  Debug: debug
  Release: release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  AkshatOS:
    type: application
    platform: iOS
    sources:
      - path: AkshatOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshatksingh18.akshatos
        PRODUCT_NAME: AkshatOS
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: AkshatOS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "AkshatOS uses your current location once so you can choose and confirm your Home boundary."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "AkshatOS uses one Home boundary to pause squat reminders when you leave and resume them when you return, even when the app is closed."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        SUPPORTS_MACCATALYST: "NO"

  AkshatOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    dependencies:
      - target: AkshatOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshatksingh18.akshatos.unittests
        GENERATE_INFOPLIST_FILE: "YES"

  AkshatOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AkshatOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshatksingh18.akshatos.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  AkshatOS:
    build:
      targets:
        AkshatOS: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - AkshatOSUnitTests
        - AkshatOSUITests

name: iOS Cloud Build

on:
  workflow_dispatch:
    inputs:
      package_ipa:
        description: "Package a release IPA (leave off while developing Build 39)"
        type: boolean
        default: false
      build_variant:
        description: "Build to package only when package_ipa is enabled"
        type: choice
        default: standard
        options:
          - standard
          - study-live-activity
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-cloud-build-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODE_PATH: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT_PATH: ios/AkshatOS.xcodeproj
  SCHEME: AkshatOS
  BUNDLE_ID: com.akshatksingh18.akshatos

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.changes.outputs.build_required }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull request changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          build_required=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            compare_base="$BASE_SHA"
            if [[ "$PR_ACTION" == "synchronize" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              compare_base="$BEFORE_SHA"
            fi
            changed_file_list="$RUNNER_TEMP/changed-files"
            if git diff --name-only -z "$compare_base" "$HEAD_SHA" > "$changed_file_list"; then
              mapfile -d '' changed_files < "$changed_file_list"
              if [[ ${#changed_files[@]} -gt 0 ]]; then
                build_required=false
              fi
              for path in "${changed_files[@]}"; do
                if [[ "${path,,}" != *.md ]]; then
                  build_required=true
                  break
                fi
              done
            fi
          fi
          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"
          echo "macOS build required: $build_required" >> "$GITHUB_STEP_SUMMARY"
      - name: Check source boundaries, test inventory and backup coverage
        run: |
          python3 ios/scripts/check-boundaries.py
          python3 ios/scripts/check-test-inventory.py
          python3 ios/scripts/check-backup-coverage.py
          python3 ios/scripts/test-release-contract.py
      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck=""

  build:
    name: Build and test iOS
    needs: checks
    if: ${{ needs.checks.outputs.build_required == 'true' }}
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve selected release variant without packaging
        shell: bash
        env:
          REQUESTED_VARIANT: ${{ inputs.build_variant || 'standard' }}
        run: |
          set -euo pipefail
          python3 ios/scripts/release-variant.py --variant "$REQUESTED_VARIANT" \
            --runner-temp "$RUNNER_TEMP" --run-number "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Selected build variant: $REQUESTED_VARIANT (packaging requires a separate release trigger)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          xcodegen_bin="$(find "$install_root" -type f -name xcodegen -perm -111 -print -quit)"
          test -n "$xcodegen_bin"
          echo "XCODEGEN_BIN=$xcodegen_bin" >> "$GITHUB_ENV"
          "$xcodegen_bin" --version

      - name: Generate placeholder icon and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          swift ios/scripts/generate-app-icon.swift \
            "$GITHUB_WORKSPACE/ios/AkshatOS/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          "$XCODEGEN_BIN" generate --spec ios/project.yml
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Check source module boundaries and backup coverage
        run: |
          python3 ios/scripts/check-boundaries.py
          python3 ios/scripts/check-backup-coverage.py

      - name: Test registered feature domains
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/scripts/check-test-inventory.py --run

      - name: Compile simulator build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Test persistence and hub navigation on simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcodebuild test -project "$PROJECT_PATH" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-simulator" \
            -resultBundlePath "$RUNNER_TEMP/HubTests.xcresult" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export simulator evidence
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -d "$RUNNER_TEMP/HubTests.xcresult" ]; then exit 0; fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts/screenshots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/HubTests.xcresult" \
            --output-path "$GITHUB_WORKSPACE/artifacts/screenshots"

      - name: Upload test diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: test-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/HubTests.xcresult
            artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Compile and validate Live Activity bundles without packaging
        shell: bash
        run: |
          set -euo pipefail
          "$XCODEGEN_BIN" generate --spec ios/project-live-activity.yml
          xcodebuild build -project "$PROJECT_PATH" -scheme "$SCHEME" \
            -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-simulator" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          candidate="$RUNNER_TEMP/DerivedData-simulator/Build/Products/Debug-iphonesimulator/AkshatOS.app"
          test -d "$candidate/PlugIns/StudyActivityExtension.appex"
          test "$(plutil -extract NSSupportsLiveActivities raw "$candidate/Info.plist")" = true
          xcodebuild build -project "$PROJECT_PATH" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-activity-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO
          activity_app="$RUNNER_TEMP/DerivedData-activity-device/Build/Products/Release-iphoneos/AkshatOS.app"
          extension="$activity_app/PlugIns/StudyActivityExtension.appex"
          lipo -verify_arch arm64 "$activity_app/AkshatOS"
          lipo -verify_arch arm64 "$extension/StudyActivityExtension"
          test -x "$extension/StudyActivityExtension"
          python3 ios/scripts/validate-ipa.py "$activity_app" --variant study-live-activity
          "$XCODEGEN_BIN" generate --spec ios/project.yml

      - name: Build unsigned device application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO
          app_path="$RUNNER_TEMP/DerivedData-device/Build/Products/Release-iphoneos/AkshatOS.app"
          lipo -verify_arch arm64 "$app_path/AkshatOS"
          python3 ios/scripts/validate-ipa.py "$app_path" --variant standard

      - name: Validate selected device bundle without packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/scripts/validate-ipa.py \
            "$DEVICE_DERIVED_DATA/Build/Products/Release-iphoneos/AkshatOS.app" --variant "$BUILD_VARIANT"
          echo "Both device variants validated; selected=$BUILD_VARIANT" >> "$GITHUB_STEP_SUMMARY"

      - name: Package and inspect IPA
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_ipa) }}
        shell: bash
        run: |
          set -euo pipefail
          app_path="$DEVICE_DERIVED_DATA/Build/Products/Release-iphoneos/AkshatOS.app"
          package_root="$RUNNER_TEMP/ipa-package"
          artifact_root="$GITHUB_WORKSPACE/artifacts/release"
          ipa_path="$artifact_root/$IPA_FILENAME"

          test -d "$app_path"
          test -x "$app_path/AkshatOS"
          actual_bundle_id="$(plutil -extract CFBundleIdentifier raw "$app_path/Info.plist")"
          test "$actual_bundle_id" = "$BUNDLE_ID"
          lipo -info "$app_path/AkshatOS"

          mkdir -p "$package_root/Payload" "$artifact_root"
          ditto "$app_path" "$package_root/Payload/AkshatOS.app"
          (
            cd "$package_root"
            zip -qry "$ipa_path" Payload
          )

          test -s "$ipa_path"
          python3 ios/scripts/validate-ipa.py "$ipa_path" --variant "$BUILD_VARIANT"
          shasum -a 256 "$ipa_path" | tee "$artifact_root/$IPA_FILENAME.sha256"
          {
            echo "commit=$GITHUB_SHA"
            echo "bundle_id=$actual_bundle_id"
            echo "build_variant=$BUILD_VARIANT"
            if [[ "$BUILD_VARIANT" == study-live-activity ]]; then
              echo "extension_bundle_id=$(plutil -extract CFBundleIdentifier raw "$app_path/PlugIns/StudyActivityExtension.appex/Info.plist")"
            else
              echo "extension_bundle_id=none"
            fi
            echo "marketing_version=$(plutil -extract CFBundleShortVersionString raw "$app_path/Info.plist")"
            echo "build_number=$(plutil -extract CFBundleVersion raw "$app_path/Info.plist")"
            echo "xcodegen_version=$($XCODEGEN_BIN --version)"
            xcodebuild -version
          } > "$artifact_root/build-info.txt"

      - name: Upload IPA artifact
        if: ${{ success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_ipa)) }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ env.IPA_ARTIFACT_NAME }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  gate:
    name: CI Gate
    needs: [checks, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all prerequisite jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_REQUIRED: ${{ needs.checks.outputs.build_required }}
        run: |
          echo "Source checks: $CHECKS_RESULT; macOS build required: $BUILD_REQUIRED; build/tests: $BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$CHECKS_RESULT" = success
          if [[ "$BUILD_REQUIRED" == true ]]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_REQUIRED" = false
            test "$BUILD_RESULT" = skipped
          fi
